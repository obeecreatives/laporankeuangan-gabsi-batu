    <meta name="description" content="Aplikasi modern manajemen dan laporan keuangan GABSI Kota Batu dengan sinkronisasi Google Sheets / GAS, role-based access control, dan offline-first caching." />
    <meta property="og:title" content="GABSI Batu - Laporan Keuangan" />

    <meta name="twitter:card" content="summary_large_image" />
    
    <!-- PWA Settings -->
    <meta name="theme-color" content="#0284c7" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />

    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <script>
      // Early capture of beforeinstallprompt so it is never missed
      window.__deferredPrompt = null;
      window.addEventListener('beforeinstallprompt', function (e) {
        e.preventDefault();
        window.__deferredPrompt = e;
        window.dispatchEvent(new CustomEvent('pwa-prompt-captured'));
      });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
